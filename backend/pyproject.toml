[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "razorflow"
version = "0.1.0"
description = "Institutional-Grade Revenue Recovery Orchestration Platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "RazorFlow Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "redis[hiredis]>=5.0.3",
    "celery[redis]>=5.3.6",
    "httpx>=0.27.0",
    "cryptography>=42.0.5",
    "google-genai>=0.1.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.4",
    "mypy>=1.9.0",
    "aiosqlite>=0.20.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "packages*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "packages/persistence/migrations/versions",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = "."
exclude = [
    "packages/persistence/migrations/versions",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --durations=10"
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
